server:
  port: 8080
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:file:./data/orders;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
seata:
  enabled: true
  application-id: order-service
  tx-service-group: mall-tx-group
  service:
    vgroup-mapping:
      mall-tx-group: default
    grouplist:
      default: 127.0.0.1:8091
